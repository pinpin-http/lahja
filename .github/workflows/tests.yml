name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Python 3.12 and pinned dependencies (without the training group)
        run: |
          uv python install 3.12
          uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Tests
        run: uv run pytest
