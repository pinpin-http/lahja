<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lahja · Arabic dialect identification</title>
  <meta name="description" content="Type a sentence in Arabic: Lahja says whether it comes from the Gulf, the Levant, Egypt, the Maghreb, or Modern Standard Arabic.">
  <meta name="theme-color" content="#07070c">
  <meta property="og:title" content="Lahja · لهجة">
  <meta property="og:description" content="Arabic dialect identification: Gulf, Levant, Egypt, Maghreb, MSA.">
  <!-- empty: the page calls the API that serves it; a URL: the browser downloads the model from there
       and runs it itself (ONNX Runtime Web), as on the public page -->
  <meta name="lahja-model" content="">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2334c3ff'/%3E%3Cstop offset='.5' stop-color='%239b72ff'/%3E%3Cstop offset='1' stop-color='%23f25ca8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='%2307070c'/%3E%3Ccircle cx='32' cy='32' r='22' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200..600&display=swap" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="chroma" aria-hidden="true">
    <div class="parallax"><div class="aurora"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div></div>
    <div class="tint"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <header class="top">
    <a class="mark" href="/" aria-label="Lahja"><span class="orb"></span>Lahja</a>
    <div class="top-right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="fr">FR</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1><span class="ar" lang="ar" dir="rtl">لهجة</span></h1>
      <p class="lede" data-i18n="lede"></p>
    </section>

    <section class="composer" id="composer">
      <textarea id="text" dir="rtl" lang="ar" rows="2" spellcheck="false" autocomplete="off" aria-labelledby="text-label"></textarea>
      <span id="text-label" class="sr-only" data-i18n="placeholder"></span>
      <div class="composer-foot">
        <span id="count" class="count"></span>
        <div class="actions">
          <button type="button" id="clear" class="ghost" hidden data-i18n-aria="clear">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
          <button type="button" id="go" class="go" data-i18n-aria="analyse">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </section>

    <nav class="examples" aria-labelledby="examples-label">
      <span id="examples-label" class="examples-label" data-i18n="examples"></span>
      <div id="examples" class="chips"></div>
    </nav>

    <section id="result" class="result" hidden aria-live="polite">
      <div class="verdict">
        <div>
          <p class="kicker" data-i18n="detected"></p>
          <p id="label" class="label"></p>
        </div>
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 64 64"><circle class="ring-track" cx="32" cy="32" r="27"/><circle id="ring-fill" class="ring-fill" cx="32" cy="32" r="27"/></svg>
          <span id="conf" class="ring-value"></span>
        </div>
      </div>
      <ul id="bars" class="bars"></ul>
      <div class="weighed">
        <p class="kicker" data-i18n="weighed"></p>
        <p id="words" class="words" dir="rtl" lang="ar"></p>
        <p id="words-hint" class="hint" hidden></p>
      </div>
    </section>

    <section id="pending" class="result pending" hidden aria-live="polite">
      <div class="shimmer"></div><div class="shimmer short"></div><div class="shimmer"></div>
      <div id="progress" class="progress" hidden><span id="progress-fill"></span></div>
      <p id="pending-text" class="hint"></p>
    </section>

    <p id="note" class="note" hidden></p>


  </main>

  <footer class="foot">
    <a id="card" href="https://huggingface.co/pinpin-http/lahja" data-i18n="card"></a>
    <a href="https://huggingface.co/pinpin-http/lahja" data-i18n="hub">Hugging Face</a>
    <a class="me" href="https://soheib.fr">soheib.fr</a>
  </footer>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
